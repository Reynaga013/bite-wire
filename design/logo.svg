<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- "Byte": chip/circuit silhouette, centered with safe margin for
       maskable icon masking on Android. -->
  <g transform="translate(76,64) scale(3.6)">
    <!-- pines del chip -->
    <g stroke="#F2F2F7" stroke-width="4.5" stroke-linecap="round">
      <line x1="22" y1="6" x2="22" y2="18"/>
      <line x1="38" y1="6" x2="38" y2="18"/>
      <line x1="54" y1="6" x2="54" y2="18"/>
      <line x1="22" y1="82" x2="22" y2="94"/>
      <line x1="38" y1="82" x2="38" y2="94"/>
      <line x1="54" y1="82" x2="54" y2="94"/>
      <line x1="6" y1="22" x2="18" y2="22"/>
      <line x1="6" y1="38" x2="18" y2="38"/>
      <line x1="6" y1="54" x2="18" y2="54"/>
      <line x1="82" y1="22" x2="94" y2="22"/>
      <line x1="82" y1="38" x2="94" y2="38"/>
      <line x1="82" y1="54" x2="94" y2="54"/>
    </g>
    <!-- cuerpo del chip -->
    <rect x="18" y="18" width="64" height="64" rx="10" fill="#F2F2F7"/>
    <!-- núcleo hueco, deja ver el fondo -->
    <rect x="34" y="34" width="32" height="32" rx="5" fill="#000000" fill-opacity="0.82"/>
  </g>

  <!-- "Wire": la misma traza tipo gráfico/circuito en dorado, cruzando por
       debajo del chip — el motivo compartido con las otras apps. -->
  <path d="M 84 300
           C 136 300, 148 256, 200 264
           C 250 272, 262 224, 312 236
           C 350 245, 362 236, 428 240"
        fill="none" stroke="#D9A24B" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="264" r="11" fill="#D9A24B"/>
  <circle cx="312" cy="236" r="11" fill="#D9A24B"/>
</svg>
