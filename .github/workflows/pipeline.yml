name: Actualizar dashboard Bite & Wire

on:
  schedule:
    - cron: "40 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr pipeline (noticias, impacto, oportunidades)
        run: python3 scripts/pipeline.py
      - name: Generar dashboard (docs/index.html)
        run: python3 scripts/build_dashboard.py
      - name: Publicar cambios en el repo (GitHub Pages sirve docs/)
        run: |
          git config user.name "Bite & Wire bot"
          git config user.email "actions@github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar en esta corrida."
          else
            git commit -m "Actualizacion automatica $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
